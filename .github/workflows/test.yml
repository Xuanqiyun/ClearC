# 每次推送都在 GitHub 的 Linux 和 Windows 机器上跑测试；Windows 上还会构建 exe，并在真的 NTFS 系统盘上跑一遍自检。
# 只读仓库，不写回任何东西。结果在 Actions 页面里看：失败的原因和自检报告也写成了注释；exe 和自检报告作为附件保留 14 天。
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install ntfs-3g
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ntfs-3g
      - name: tests
        run: bash tests/ci.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: tests, build and self-test
        shell: powershell
        run: .\tests\ci.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clearc-windows
          path: |
            out/ClearC.exe
            out/selftest.txt
            out/uitest*.txt
            out/uitest-*.png
          retention-days: 14
